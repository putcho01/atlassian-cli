name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tparse
        run: go install github.com/mfridman/tparse@latest

      - name: Run tests
        run: go test --shuffle on --race -json ./... | tparse -all -format markdown | tee -a $GITHUB_STEP_SUMMARY
